[board]
size = 20
squareSize = 1
lightSquareColor = "#f0d9b5"
darkSquareColor = "#b58863"
squareDepth = 0.05

[piece]
size = 0.5
hoverColor = "#22c55e"
moveHighlightColor = "#86efac"
moveHighlightOpacity = 0.9
labelFontSize = 0.28

[camera]
# Orthographic isometric: equal x/y/z offset from origin (see getIsometricCameraPosition).
distance = 22
# Multiplier on board half-diagonal for frustum sizing (1.0 = tight fit).
fitPadding = 1.12
near = 0.1
far = 500

[canvas]
height = 800
background = "#0f172a"

[lighting.ambient]
intensity = 0.7

[lighting.directional]
position = [4, 8, 6]
intensity = 1.2
